name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("haven","dplyr","nnet","sandwich","pROC","mice","survey"), repos="https://cloud.r-project.org")'

      - name: Install python-docx
        run: pip install python-docx

      - name: Run the full pipeline on synthetic data
        run: bash run_all.sh

      - name: Fail if any script failed
        run: |
          if grep -q '^FAIL' logs_summary.txt 2>/dev/null; then exit 1; fi
          test -f out/jamda_full.rds
          test -f figures/Figure_2.png
          test -f out/Supplementary_Tables_S1-S3.docx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
