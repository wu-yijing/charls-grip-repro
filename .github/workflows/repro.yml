name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    # 22.04 ships with a prebuilt R binary from Posit. On ubuntu-latest (24.04)
    # setup-r builds R from source, which alone takes 25-30 minutes.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          # Precompiled Linux binaries from Posit Package Manager. Without this
          # every package is compiled from source.
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show the R environment
        run: |
          Rscript -e 'cat(R.version.string, "\n"); print(getOption("repos"))'

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("haven","dplyr","nnet","sandwich","pROC","mice","survey"), Ncpus = 2)'
          Rscript -e 'for (p in c("haven","dplyr","nnet","sandwich","pROC","mice","survey")) cat(sprintf("%-10s %s\n", p, as.character(packageVersion(p))))'

      - name: Install python-docx
        run: pip install python-docx

      - name: Run the full pipeline on synthetic data
        run: bash run_all.sh

      - name: Fail if any script failed
        run: |
          cat logs_summary.txt
          grep -q '^failed: 0$' logs_summary.txt
          test -f out/jamda_full.rds
          test -f figures/Figure_2.png
          test -f out/Supplementary_Tables_S1-S3.docx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
