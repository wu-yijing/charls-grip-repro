name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    # 22.04 ships with a prebuilt R binary from Posit. On ubuntu-latest (24.04)
    # setup-r builds R from source, which alone takes 25-30 minutes.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          # Precompiled Linux binaries from Posit Package Manager. Without this
          # every package is compiled from source.
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show the R environment
        run: |
          Rscript -e 'cat(R.version.string, "\n"); print(getOption("repos"))'

      # The package list is derived from the scripts rather than written out
      # here. A hand-maintained list silently drifts: the first CI run after the
      # R install was fixed failed on 07_figure2.R because ggplot2, scales and
      # patchwork were never listed, although they load fine on any machine that
      # has used R before.
      - name: Install the packages the scripts actually load
        run: |
          cat > /tmp/deps.R <<'RS'
          files <- list.files("code", pattern = "[.]R$", full.names = TRUE)
          pat <- "(library|require)\\([\"']?[A-Za-z][A-Za-z0-9._]*"
          used <- sort(unique(unlist(lapply(files, function(f) {
            txt <- readLines(f, warn = FALSE, encoding = "UTF-8")
            sub("^.*\\([\"']?", "", unlist(regmatches(txt, gregexpr(pat, txt))))
          }))))
          cat("declared:", paste(used, collapse = ", "), "\n")
          want <- setdiff(used, rownames(installed.packages()))
          cat("to add  :", paste(want, collapse = ", "), "\n")
          if (length(want)) install.packages(want, Ncpus = 2)
          missing <- setdiff(used, rownames(installed.packages()))
          if (length(missing)) {
            cat("STILL MISSING:", paste(missing, collapse = ", "), "\n")
            quit(status = 1)
          }
          for (p in used) cat(sprintf("  %-10s %s\n", p, as.character(packageVersion(p))))
          RS
          Rscript /tmp/deps.R

      - name: Install python-docx
        run: pip install python-docx

      - name: Run the full pipeline on synthetic data
        run: bash run_all.sh

      - name: Fail if any script failed
        run: |
          cat logs_summary.txt
          grep -q '^failed: 0$' logs_summary.txt
          test -f out/jamda_full.rds
          test -f figures/Figure_2.png
          test -f out/Supplementary_Tables_S1-S3.docx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
