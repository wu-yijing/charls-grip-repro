name: publish release

# Zenodo's GitHub integration archives a repository when a *release* is
# published, not when a tag is pushed. This job closes that gap: it publishes a
# release for every tag that has a notes file under .github/release-notes/ and
# no release yet. To cut a release, add `.github/release-notes/<tag>.md` whose
# first line is `# <tag> — <one-line title>`; the rest of the file becomes the
# release body. Tags without a notes file are left alone, and tags that already
# have a release are skipped, so re-running is harmless.

on:
  push:
    branches: [main]
    paths:
      - ".github/release-notes/*.md"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish a release for each tag that has notes but no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          shopt -s nullglob
          published=0
          for f in .github/release-notes/v*.md; do
            tag=$(basename "$f" .md)
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag: no such tag, skipping"
              continue
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: release already published, skipping"
              continue
            fi
            title=$(head -1 "$f" | sed 's/^# *//')
            echo "$tag: publishing — $title"
            gh release create "$tag" \
              --title "$title" \
              --notes-file "$f" \
              --verify-tag
            published=$((published + 1))
          done
          echo "published $published release(s)"
